services:
  _defaults:
    autowire: true
    autoconfigure: true

  K3Progetti\SoftwareVersionBundle\Service\ComposerInfoService: ~

  K3Progetti\SoftwareVersionBundle\Command\GetComposerInfo:
    tags: [ console.command ]

  K3Progetti\SoftwareVersionBundle\Command\SendInfoCommand:
    arguments:
      $endpoint: '%software_version.endpoint%'
      $key: '%software_version.key%'
    tags: [ console.command ]
